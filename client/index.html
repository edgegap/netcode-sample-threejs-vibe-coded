<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070a14" />
  <title>Orb Herders</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Three.js and the Edgegap JS SDK from a CDN, pinned. The integrity hash makes the browser
       refuse a modified SDK file. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "@edgegap/sdk": "https://cdn.jsdelivr.net/npm/@edgegap/sdk@1.1.0/dist/browser/edgegap.js"
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/@edgegap/sdk@1.1.0/dist/browser/edgegap.js": "sha384-U8KQMl3e8xF4aAIJJMXV8IdkCKWiHSQhHISsedbG4z/L99dNOq5FoRlMgPDYgNUF"
      }
    }
  </script>
</head>
<body>
  <div class="ui">
    <div class="menu" id="menu" hidden>
      <h1>Orb Herders</h1>
      <p class="tagline">Herd glowing orbs into your goal. Shove rival drones out of the way.</p>
      <label>Name <input id="name" maxlength="16" autocomplete="off" /></label>
      <div class="bots">Bots (solo)
        <button data-bots="1">1</button><button data-bots="2">2</button><button data-bots="3">3</button>
      </div>
      <div class="buttons">
        <button id="find" class="primary">Find match</button>
        <button id="solo">Play vs bots</button>
        <button id="local" hidden>Local server :7777</button>
        <button id="cancel" hidden>Cancel</button>
      </div>
      <p id="status" class="status"></p>
      <p class="help">Move: WASD / arrows, or drag on the left of the screen. Dash: Space / Shift, or the DASH button. Your goal is the one at the bottom. Gold orbs are worth 3. First to 15, or the most points after 3:00.</p>
    </div>
    <div class="hud" id="hud" hidden>
      <ol class="board" id="board"></ol>
      <div class="banner" id="banner"></div>
      <div class="big" id="big"></div>
      <button class="quit" id="quit" aria-label="Leave match">✕</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
